services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:4173"
    environment:
      - NODE_ENV=production
    command: pnpm preview --host

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.production
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
    command: pnpm start
